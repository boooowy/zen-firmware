name: Update keymap.json

# config/keymap.keymap is committed straight to main by the Keymap Editor bot,
# so zen-hud/keymap.json (what zen-hud reads) has to be regenerated for it.
#
# The output lives outside config/ on purpose: the Keymap Editor treats
# config/*.json as layout metadata and writes config/keymap.json itself, so a
# file of ours there stopped the editor from opening the repo.
#
# The path filter is also the loop guard: this job only writes
# zen-hud/keymap.json, which is not a trigger path, so its own commit cannot
# re-trigger it.

on:
  push:
    paths:
      - config/keymap.keymap
      - config/info.json
      - tools/build_keymap_json.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keymap-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      - name: Generate zen-hud/keymap.json
        run: python tools/build_keymap_json.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- zen-hud/keymap.json; then
            echo "zen-hud/keymap.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zen-hud/keymap.json
          git commit -m "chore: regenerate zen-hud/keymap.json"
          git push
