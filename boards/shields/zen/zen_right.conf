CONFIG_ZMK_KEYBOARD_NAME="ZEN"
# Off: ZMK Studio's own RPC transport would otherwise race
# zen_config_serial_bridge (and any future zen_display_serial_bridge) for
# bytes on the same zmk_studio_rpc_uart chosen node. The studio-rpc-usb-uart
# snippet is kept only for the USB CDC-ACM endpoint/chosen node it provides.
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_BT_MAX_CONN=5
# 5 user-facing Bluetooth channels. On a split central ZMK gives you
# CONFIG_BT_MAX_PAIRED minus the peripherals it reserves, so this has to be 6
# for the keymap's BT1..BT5 keys to all work -- at 5 the BT5 key (&bt BT_SEL 4)
# was out of range and did nothing.
CONFIG_BT_MAX_PAIRED=6
